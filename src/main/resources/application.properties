spring.application.name=scheduler-base

# =========================
# AZURE KEY VAULT
# =========================
# Vault actual: kv-uvicar-prd-pe
# On-premise / fuera de Azure:
# - AZURE_CLIENT_ID
# - AZURE_TENANT_ID
# - AZURE_CLIENT_SECRET
spring.cloud.azure.profile.tenant-id=${AZURE_TENANT_ID:}
spring.cloud.azure.credential.client-id=${AZURE_CLIENT_ID:}
spring.cloud.azure.credential.client-secret=${AZURE_CLIENT_SECRET:}
spring.cloud.azure.keyvault.secret.property-source-enabled=${AZURE_KEYVAULT_ENABLED:true}
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=${AZURE_KEYVAULT_ENDPOINT:https://kv-uvicar-prd-pe.vault.azure.net/}
spring.cloud.azure.keyvault.secret.property-sources[0].secret-keys[0]=uvischedule-db-url-1
spring.cloud.azure.keyvault.secret.property-sources[0].secret-keys[1]=uvischedule-db-password
spring.cloud.azure.keyvault.secret.property-sources[0].secret-keys[2]=uvischedule-mail-password
spring.cloud.azure.keyvault.secret.property-sources[0].secret-keys[3]=uvischedule-mail-user-name

# =========================
# DATASOURCE SQL SERVER
# =========================
# Secretos esperados desde Azure Key Vault:
# - uvischedule-db-url-1
# - uvischedule-db-password
# Como respaldo, tambien se aceptan UVISCHEDULE_DB_URL y UVISCHEDULE_DB_PASSWORD.
spring.datasource.url=${uvischedule-db-url-1:${UVISCHEDULE_DB_URL:}}
spring.datasource.username=${UVICAR_DB_USERNAME:reporte}
spring.datasource.password=${uvischedule-db-password:${UVISCHEDULE_DB_PASSWORD:}}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# No usar schema.sql ni data.sql
spring.sql.init.mode=never

# =========================
# API (consulta por ventana tiempo calculada)
# =========================
uvicar.transmissions.table=tTransmisiones
uvicar.transmissions.last-minutes=10
uvicar.transmissions.top=200
uvicar.reports.clientes-grandes.sin-trans-3dias.sp=pa_RptUniActSinTrans3Dias_ClientesGrandes
uvicar.reports.unidades.sin-transm-mtcosinrg-15min-a-2hrs.sp=pa_uniSinTransm_MTCOSINRG_15MinA2Hrs
uvicar.reports.unidades.sin-transm-mtcosinrg-2hrs-a-2dias.sp=pa_uniSinTransm_MTCOSINRG_2HrsA2Dias
uvicar.reports.unidades.sin-transm-mtcosinrg-mas-de-2dias.sp=pa_uniSinTransm_MTCOSINRG_MasDe2Dias
uvicar.notifications.event-email.sp=pa_envioCorreosEventosAlertas_1Hora
uvicar.notifications.event-email.delivery-mode=${UVICAR_NOTIFICATIONS_EVENT_EMAIL_DELIVERY_MODE:smtp}
uvicar.notifications.event-email.from=${uvischedule-mail-user-name:${MAIL_FROM:}}
uvicar.notifications.event-email.subject-template=[UVICAR] Alerta de evento para placa %s

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${uvischedule-mail-user-name:${MAIL_USERNAME:}}
spring.mail.password=${uvischedule-mail-password:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}

# =========================
# JOBS
# =========================
jobs.timezone=America/Lima
jobs.notifications.event-email.enabled=true
jobs.notifications.event-email.cron=0 0 * * * *
jobs.notifications.event-email.raz-tra=${JOBS_NOTIFICATIONS_EVENT_EMAIL_RAZ_TRA:44}
jobs.seed.enabled=true
jobs.seed.cron=*/30 * * * * *
jobs.seed.rows-per-run=10
jobs.seed.disable-triggers=false
jobs.seed.report-compatible=true
# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=false

# =========================
# SERVER
# =========================
server.port=${SERVER_PORT:8081}
jobs.seed.use-templates=true
jobs.seed.templates.location=classpath:seed/transmission-templates.json
jobs.seed.allowed-cod-uni=24794,19207,-31865,32019,23737
